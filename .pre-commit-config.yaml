fail_fast: false

# pre-push is installed alongside pre-commit so the slower hooks below, which are
# confined to that stage, actually run.
default_install_hook_types: [pre-commit, pre-push]

repos:
- repo: local
  hooks:
  - id: inv-lint
    name: Lint (with Ruff)
    entry: uv run --all-groups invoke lint
    pass_filenames: False
    language: system

  - id: inv-format
    name: Format Check (with Ruff)
    entry: uv run --all-groups invoke format --check
    pass_filenames: False
    language: system
    files: \.py$

  - id: inv-type-check
    name: Type Check (with Mypy)
    entry: uv run --all-groups invoke type-check
    pass_filenames: False
    language: system
    files: ^(visionsim/|tasks/)

  - id: inv-tests
    name: Run Tests
    entry: uv run --all-groups invoke test
    pass_filenames: False
    language: system
    # The suite renders through Blender and takes minutes; keep it off the commit path.
    # Set $VSIM_BLENDER to pin a specific build (otherwise Blender must be on $PATH).
    stages: [pre-push]

  - id: inv-docs
    name: Build Docs
    entry: uv run --all-groups invoke clean-docs build-docs
    pass_filenames: False
    language: system
    files: ^(docs/|tasks/figures/)
