histogrammer:
  min_depth: !Quantity 0.01 meters
  max_depth: !Quantity 11.0 meters
  n_bins: 418
  bin_width: !Quantity 0.030 meters  # 200 ps round-trip time bin width
  pixel_fov_list: [
    [0.0, 0.125, 0.0, 0.125], [0.0, 0.125, 0.125, 0.25], [0.0, 0.125, 0.25, 0.375], [0.0, 0.125, 0.375, 0.5],
    [0.0, 0.125, 0.5, 0.625], [0.0, 0.125, 0.625, 0.75], [0.0, 0.125, 0.75, 0.875], [0.0, 0.125, 0.875, 1.0],
    [0.125, 0.25, 0.0, 0.125], [0.125, 0.25, 0.125, 0.25], [0.125, 0.25, 0.25, 0.375], [0.125, 0.25, 0.375, 0.5],
    [0.125, 0.25, 0.5, 0.625], [0.125, 0.25, 0.625, 0.75], [0.125, 0.25, 0.75, 0.875], [0.125, 0.25, 0.875, 1.0],
    [0.25, 0.375, 0.0, 0.125], [0.25, 0.375, 0.125, 0.25], [0.25, 0.375, 0.25, 0.375], [0.25, 0.375, 0.375, 0.5],
    [0.25, 0.375, 0.5, 0.625], [0.25, 0.375, 0.625, 0.75], [0.25, 0.375, 0.75, 0.875], [0.25, 0.375, 0.875, 1.0],
    [0.375, 0.5, 0.0, 0.125], [0.375, 0.5, 0.125, 0.25], [0.375, 0.5, 0.25, 0.375], [0.375, 0.5, 0.375, 0.5],
    [0.375, 0.5, 0.5, 0.625], [0.375, 0.5, 0.625, 0.75], [0.375, 0.5, 0.75, 0.875], [0.375, 0.5, 0.875, 1.0],
    [0.5, 0.625, 0.0, 0.125], [0.5, 0.625, 0.125, 0.25], [0.5, 0.625, 0.25, 0.375], [0.5, 0.625, 0.375, 0.5],
    [0.5, 0.625, 0.5, 0.625], [0.5, 0.625, 0.625, 0.75], [0.5, 0.625, 0.75, 0.875], [0.5, 0.625, 0.875, 1.0],
    [0.625, 0.75, 0.0, 0.125], [0.625, 0.75, 0.125, 0.25], [0.625, 0.75, 0.25, 0.375], [0.625, 0.75, 0.375, 0.5],
    [0.625, 0.75, 0.5, 0.625], [0.625, 0.75, 0.625, 0.75], [0.625, 0.75, 0.75, 0.875], [0.625, 0.75, 0.875, 1.0],
    [0.75, 0.875, 0.0, 0.125], [0.75, 0.875, 0.125, 0.25], [0.75, 0.875, 0.25, 0.375], [0.75, 0.875, 0.375, 0.5],
    [0.75, 0.875, 0.5, 0.625], [0.75, 0.875, 0.625, 0.75], [0.75, 0.875, 0.75, 0.875], [0.75, 0.875, 0.875, 1.0],
    [0.875, 1.0, 0.0, 0.125], [0.875, 1.0, 0.125, 0.25], [0.875, 1.0, 0.25, 0.375], [0.875, 1.0, 0.375, 0.5],
    [0.875, 1.0, 0.5, 0.625], [0.875, 1.0, 0.625, 0.75], [0.875, 1.0, 0.75, 0.875], [0.875, 1.0, 0.875, 1.0]
  ]
  n_pulses: 2000000
  dead_time_s: !Quantity 10.0 nanoseconds  # Hardware register 0x29 setting 63
  free_running: false

active_source:
  pulsed_laser:
    enabled: true
    wavelength: !Quantity 940.0 nanometer
    pulse_repetition: !Quantity 10.94 megahertz
    pulse_width: !Quantity 1300.0 picosecond
    avg_watts: !Quantity 0.34 watt
    pulse_shape: "GAUSSIAN"

ambient_source:
  sun:
    enabled: true
    temperature: !Quantity 5778.0 kelvin
    light_conditions: "BRIGHT_SUNLIGHT"
    lambda_pass: !Quantity 940.0 nanometer
    delta_lambda: !Quantity 20.0 nanometer
    intensity: !Quantity 3.828e26 watt / meter**2

sensor:
  size: [32, 48]  # Physical SPAD grid [height, width]
  pixel_pitch: !Quantity 11.8 micrometer
  f_number: 1.4   # Unitless optical aperture ratio (f/1.4)
  fov: [!Quantity 52.8 degree, !Quantity 67.9 degree]