# Histogrammer 
histogrammer:
  min_depth: !Quantity 0.0 meters
  max_depth: !Quantity 10.0 meters #76.4 meters
  n_bins: 672
  bin_width: !Quantity 0.022 meters #0.758 nanoseconds  # meters per bin --- .758 ns -> meters
  pixel_fov_list: [[0, 0.4, 0.3, 0.6], [0.2, 0.6, 0.6, 0.9]] ## ?  ## Row start row end col start col end
  n_pulses: 1000 #81047 #781047   # number of laser pulses -->> Will depend on settings
  dead_time_s: !Quantity 10.0 nanoseconds # Dead time in seconds -->> CHECK THIS currently using 10ns but says ~7-20ns and then typ 10 min 7?
  free_running: False

# Active Light Source 
active_source:
  pulsed_laser:
    enabled: true
    wavelength: !Quantity 940.0 nanometers            # nanometers
    frequency: !Quantity 10.0 megahertz #823 kilohertz               # hertz NEED TO CHECK REGISTERS
    pulse_width: !Quantity 6 nanoseconds            # seconds NEED TO CHECK REGISTERS
    avg_watts: !Quantity 0.5 watts                    # watts UNSURE might be in regist (check colin email)
    pulse_shape: "custom"         # "gaussian", "square", or "custom" 
    # pulse_shape_custom: lambda x: np.sinc(x / 3)"
    pulse_shape_custom: [0,0,0,207,255,113,52,34,25] ## can this be any number of taps? Does it need to be the same width as the sent pulse?
    
# Ambient Light Sources 
ambient_source:
  sun:
    enabled: true
    temperature: !Quantity 5778.0 kelvin            # kelvin
    light_conditions: "OVERCAST"  # from LightConditions enum
    lambda_pass: !Quantity 550.0 nanometers             # nanometers
    delta_lambda: !Quantity 10.0 nanometers             # nanometers
    intensity: !Quantity 3.828e26 watts / meter**2      # watts per square meter

# Sensor
sensor:
  size: [20, 20]          # [height, width]
  pixel_pitch: !Quantity 101.6064 micrometer           # meters
  f_number: !Quantity 1.4         # dimensionless
  fov: !Quantity [.5 degree, .5 degree]
