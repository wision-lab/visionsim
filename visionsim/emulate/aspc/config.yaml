# Histogrammer Configuration
histogrammer:
  min_depth: !Quantity 0.0 meters
  max_depth: !Quantity 10.0 meters
  n_bins: 400
  bin_width: !Quantity 0.03 meters
  pixel_fov_list: !file "visionsim/emulate/aspc/pixel_fov_list.txt"
  n_pulses: 100
  dead_time: !Quantity 10e-9 seconds
  free_running: false

# Active Light Source Configuration
active_source:
  pulsed_laser:
    enabled: true
    wavelength: !Quantity 550.0 nanometer
    pulse_repetition: !Quantity 10.0 megahertz
    pulse_width: !Quantity 0.01 nanosecond
    avg_watts: !Quantity 2.0 milliwatts
    pulse_shape: "square"
    pulse_shape_custom: !file "visionsim/emulate/aspc/pulse_shape_custom.txt"

# Ambient Light Source Configuration
ambient_source:
  sun:
    enabled: true
    temperature: !Quantity 5778.0 kelvin
    light_conditions: "BRIGHT_SUNLIGHT"
    lambda_pass: !Quantity 550.0 nanometer
    delta_lambda: !Quantity 10.0 nanometer
    intensity: !Quantity 3.828e26 watt / meter**2

# Sensor Configuration
sensor:
  size: [300, 400]
  pixel_pitch: !Quantity 20.0 micrometer
  f_number: !Quantity 1.4
  fov: !Quantity [66 degree, 44 degree]