# Opt-in CUDA image build. GitHub-hosted runners have no GPU, so this only builds and pushes the
# image; GPU-dependent behaviour must be exercised on a machine with a GPU and the container
# toolkit. Triggered manually to keep it out of the normal push path.
name: Build CUDA Docker Image

on:
  workflow_dispatch:
    inputs:
      blender-version:
        description: Blender version to bake into the image
        required: true
        default: latest

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  docker-build-cuda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Install Blender using setup-blender
        uses: bradyajohnston/setup-blender@v5
        with:
          version: ${{ inputs.blender-version }}

      - name: Prepare Blender Context
        run: |
          BLENDER_REAL_BIN=$(readlink -f $(which blender))
          BLENDER_DIR=$(dirname $BLENDER_REAL_BIN)
          cp -rL "$BLENDER_DIR" ./blender_dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=cuda-blender-${{ inputs.blender-version }}
            type=raw,value=cuda-latest,enable=${{ inputs.blender-version == 'latest' }}
            type=sha,prefix=cuda-blender-${{ inputs.blender-version }}-
            type=ref,event=tag,prefix=cuda-blender-${{ inputs.blender-version }}-

      - name: Build and Push Docker Image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.github/workflows/vsim-ci-cuda.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cuda-blender-${{ inputs.blender-version }}
          cache-to: type=gha,scope=cuda-blender-${{ inputs.blender-version }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
