# This workflow builds and pushes a Docker image to GitHub Container Registry (GHCR).
# Based on: https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images#publishing-images-to-github-packages

name: Build Docker Image

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        blender-version: ["4.5", "latest"]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Blender using setup-blender
        uses: bradyajohnston/setup-blender@v5
        with:
          version: ${{ matrix.blender-version }}

      - name: Prepare Blender Context
        run: |
          BLENDER_REAL_BIN=$(readlink -f $(which blender))
          BLENDER_DIR=$(dirname $BLENDER_REAL_BIN)
          cp -rL "$BLENDER_DIR" ./blender_dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=blender-${{ matrix.blender-version }}
            type=raw,value=latest,enable=${{ matrix.blender-version == 'latest' }}

      - name: Build and Push Docker Image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.github/workflows/vsim-ci.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Prune unused container images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: 'true'
