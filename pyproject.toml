[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "visionsim"
description = "Towards a Sensor-Realistic World Simulator"
dynamic = ["version"]
requires-python = ">=3.10,<3.15"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent"
]
dependencies = [
    "imageio",
    "more_itertools",
    "numpy",
    "torch",
    "matplotlib",
    "scipy",
    # Windows is excluded: 1.1.0 crashes inside Windows Blender, and 1.0.0 (the safe
    # version) has no 3.14 wheel. Blender gets the right version into its own Python via
    # `vsim post-install`; the host interpreter only needs it for the in-process solve test.
    "robust-laplacian==1.1.0; sys_platform != 'win32'",
    "invoke",
    "natsort",
    "rich",
    "OpenEXR",
    "multiprocess",
    "rpyc",
    "fastdigest",
    "tyro",
    "pyyaml",
    "ephemeral-port-reserve",
    "peewee",
    "pydantic",
    "typing-extensions",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

[project.urls]
"GitHub" = "https://github.com/WISION-Lab/visionsim"

[project.scripts]
visionsim = "visionsim.cli:main"
vsim = "visionsim.cli:main"

[tool.hatch.version]
path = "visionsim/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 121
force-exclude = true
exclude = ["visionsim/interpolate/rife/*"]

[tool.mypy]
exclude = ["visionsim/interpolate/rife/*"]
follow_imports = "skip"

# Tree Clipper, the node editor's extensions and blender's own mathutils only exist
# inside Blender's own Python, which the figure services run in.
[[tool.mypy.overrides]]
module = ["tree_clipper", "tree_clipper.*", "bl_ext.*", "mathutils", "yaml"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "build>=1.3.0",
    "twine>=6.2.0",
    "mypy",
    "coverage",
    "hypothesis",
    "pre-commit",
    "pytest",
    "ruff",
    "types-jsonschema",
    'scipy-stubs; python_version >= "3.10"',
    "types-peewee",
    "syrupy>=4.9.1",
    "pytest-skip-slow>=1.1.0",
]
docs = [
    "invoke",
    "rich",
    "sphinx",
    "sphinxcontrib-programoutput>=0.18",
    "click_extra[sphinx,pygments]",
    "myst-parser",  # Should not be needed, but click_extra throws an error if it's not installed
    "sphinx-copybutton",
    "sphinx-design",
    "sphinxcontrib-video",
    "sphinxcontrib-napoleon",
    "furo",
    "scienceplots",
]
